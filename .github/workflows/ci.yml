name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # Formatting, vet and unit tests (the checks named in AGENTS.md)
  # ------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true

      - name: go fmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify the module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Static analysis
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  # ------------------------------------------------------------------
  # Multi-architecture container image
  # ------------------------------------------------------------------
  image:
    name: Build & publish image
    needs: [verify, lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so `git describe` yields a real tag

      - name: Compute version metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          COMMIT_TIME="$(git log -1 --pretty='@%at' | xargs -r date -u +'%Y-%m-%dT%H:%M:%SZ' -d)"
          {
            echo "version=${VERSION}"
            echo "build_time=${BUILD_TIME}"
            echo "commit_hash=${COMMIT_HASH}"
            echo "commit_time=${COMMIT_TIME}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            COMMIT_HASH=${{ steps.meta.outputs.commit_hash }}
            COMMIT_TIME=${{ steps.meta.outputs.commit_time }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}

      - name: Inspect the published image
        run: |
          set -euo pipefail
          for tag in ${{ steps.docker_meta.outputs.tags }}; do
            echo "::group::${tag}"
            docker buildx imagetools inspect "${tag}"
            echo "::endgroup::"
          done

      - name: Summarise
        run: |
          {
            echo "### lite-upf image published"
            echo ""
            echo "| Tag | Image |"
            echo "|-----|-------|"
            for tag in ${{ steps.docker_meta.outputs.tags }}; do
              echo "| \`${tag##*:}\` | \`${tag%:*}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
